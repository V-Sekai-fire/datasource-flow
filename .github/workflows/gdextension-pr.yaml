name: GDExtension PR

on:
  pull_request:
    branches: [main-fabric]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/gdextension-build.yaml
    permissions:
      contents: read
